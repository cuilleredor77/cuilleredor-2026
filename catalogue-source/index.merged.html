<title>Catalogue Cuillère d'Or</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@600;800&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c;
    --paper:#f7f5f0;
    --cream:#eee9df;
    --gold:#b08a3e;
    --gold-bright:#d4af37;
    --gold-deep:#6e5526;
    --muted:#5e5e5e;
    --line:rgba(26,26,26,0.16);
    --line-on-ink:rgba(255,255,255,0.22);
    --white:#ffffff;
    --ink-contrast:#f7f4ec;
    --heading-font:"Playfair Display",Georgia,"Times New Roman",serif;
    --eyebrow-tracking:.22em;
  }
  /* ---------- charte A : magazine, vif et graphique ---------- */
  .book[data-style="a"]{
    --fs:1.12;
    --ink:#1a1a1a;
    --paper:#ffffff;
    --cream:#f4f4f4;
    --gold:#a8703a;
    --gold-bright:#e2b98a;
    --gold-deep:#7a4b1f;
    --muted:#6b6b6b;
    --line:rgba(26,26,26,0.14);
    --line-on-ink:rgba(255,255,255,0.24);
    --ink-contrast:#ffffff;
    --heading-font:"Oswald",Arial,Helvetica,sans-serif;
    --eyebrow-tracking:.14em;
  }
  /* ---------- charte B : recipe book, chaleureux et minimal ---------- */
  .book[data-style="b"]{
    --fs:1.12;
    --ink:#2b2620;
    --paper:#faf6f0;
    --cream:#f0e6d8;
    --gold:#c98a4b;
    --gold-bright:#d99a5c;
    --gold-deep:#a86a34;
    --muted:#7a6f60;
    --line:rgba(43,38,32,0.16);
    --line-on-ink:rgba(255,255,255,0.22);
    --ink-contrast:#faf6f0;
    --heading-font:"Poppins",Arial,Helvetica,sans-serif;
    --eyebrow-tracking:.1em;
  }
  /* ---------- charte D : magazine gourmand, vert profond et or ---------- */
  .book[data-style="d"]{
    --ink:#16342a;
    --paper:#faf7f0;
    --cream:#eee6d3;
    --gold:#b08d57;
    --gold-bright:#cda86a;
    --gold-deep:#7a5f35;
    --muted:#6b6559;
    --line:rgba(22,52,42,0.18);
    --line-on-ink:rgba(255,255,255,0.2);
    --ink-contrast:#f7f4ea;
    --heading-font:"Cormorant Garamond",Georgia,serif;
    --eyebrow-tracking:.18em;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#f9f9f9; --cream:#f3f3f4; --ink:#1a1a1a; --muted:#5e5e5e;
    }
  }
  :root[data-theme="dark"]{
    --paper:#f9f9f9; --cream:#f3f3f4; --ink:#1a1a1a; --muted:#5e5e5e;
  }
  *{box-sizing:border-box;}
  body{
    background:#e9e6df;
    color:var(--ink);
    font-family:var(--heading-font);
    padding-block:36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .intro-note{
    width:min(794px,100%);
    padding:0 18px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }
  .book{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    width:100%;
  }
  .sheet{
    width:min(794px,100%);
    aspect-ratio:210/297;
    background:var(--paper);
    color:var(--ink);
    position:relative;
    overflow:hidden;
    container-type:inline-size;
    box-shadow:0 1.5cqi 3cqi rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.05);
    flex:0 0 auto;
  }
  .sheet.dark{ background:var(--ink); color:var(--paper); }
  .sheet.cream{ background:var(--cream); }

  /* ---------- shared type + layout primitives, sized in cqi so every sheet scales as one print-faithful unit ---------- */
  .eyebrow{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:calc(1.35cqi*var(--fs,1));
    letter-spacing:var(--eyebrow-tracking);
    text-transform:uppercase;
    color:var(--gold-deep);
  }
  .sheet.dark .eyebrow, .sheet.dark .muted, .sheet.dark .hairline{ color:var(--gold-bright); }
  h1,h2,h3{ font-family:var(--heading-font); font-weight:400; margin:0; text-wrap:balance; }
  em{ font-style:italic; color:var(--gold-deep); }
  .sheet.dark em{ color:var(--gold-bright); }
  p{ margin:0; }
  .muted{ color:var(--muted); }
  .hairline{ height:1px; background:var(--line); border:none; margin:0; }
  .sheet.dark .hairline{ background:var(--line-on-ink); }

  .frame{
    position:absolute; inset:0;
    padding:6.2cqi 7.4cqi;
    display:flex; flex-direction:column;
    justify-content:center;
  }
  .frame.top{ justify-content:flex-start; }
  .running-header{
    position:absolute; top:4.2cqi; left:7.4cqi; right:7.4cqi;
    display:flex; align-items:center; justify-content:flex-end;
    font-family:Arial,Helvetica,sans-serif;
    font-size:calc(1.38cqi*var(--fs,1)); letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }
  .running-header img{ height:2.6cqi; width:auto; display:block; }
  .running-header .rh-word{ display:flex; align-items:center; gap:.8cqi; text-decoration:none; }
  .running-footer{
    position:absolute; bottom:4cqi; left:7.4cqi; right:7.4cqi;
    display:flex; align-items:center; justify-content:space-between;
    font-family:Arial,Helvetica,sans-serif;
    font-size:calc(1.38cqi*var(--fs,1)); letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    padding-top:1.4cqi; border-top:1px solid var(--line);
  }
  .running-footer .rf-logo{
    position:absolute; left:50%; top:calc(50% + .7cqi); transform:translate(-50%,-50%);
    height:2.6cqi; width:auto; opacity:.8;
  }
  .sheet.dark .running-footer{ border-top-color:var(--line-on-ink); }
  .running-footer b{ color:var(--gold-deep); font-weight:700; font-variant-numeric:tabular-nums; }
  .sheet.dark .running-footer b{ color:var(--gold-bright); }
  .rf-nav{ display:flex; align-items:center; gap:1cqi; }
  .rf-nav a{ color:var(--gold-deep); text-decoration:none; font-size:calc(1.7cqi*var(--fs,1)); line-height:1; padding:.3cqi .5cqi; border-radius:2px; }
  .rf-nav a:hover, .rf-nav a:focus-visible{ background:rgba(110,85,38,.1); }
  table.price{ font-variant-numeric:tabular-nums; }

  .section-head{ display:flex; flex-direction:column; gap:.9cqi; margin-bottom:3.2cqi; }
  .section-title{ font-size:calc(4.15cqi*var(--fs,1)); line-height:1.08; }
  .section-lede{ font-family:Arial,Helvetica,sans-serif; font-size:calc(2cqi*var(--fs,1)); line-height:1.55; color:var(--muted); max-width:46cqi; margin-top:.7cqi; }

  .num{
    font-family:var(--heading-font); font-style:italic; color:var(--gold-deep); font-size:calc(1.9cqi*var(--fs,1));
  }
  .sheet.dark .num{ color:var(--gold-bright); }

  ul.plain{ list-style:none; margin:0; padding:0; }
  .body-copy{ font-family:Arial,Helvetica,sans-serif; font-size:calc(1.75cqi*var(--fs,1)); line-height:1.6; color:var(--ink); }
  .sheet.dark .body-copy{ color:var(--paper); }
  .body-copy.muted{ color:var(--muted); }

  img.cover-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dark-frame{ justify-content:space-between; color:var(--ink-contrast); }
  .cover-top-row{ display:flex; align-items:center; justify-content:space-between; }

  /* ---------- charte A : couverture magazine — bandeau blanc, cartouche, photo, accroche basse ---------- */
  .book[data-style="a"] #cover{ background:#141414; }
  .book[data-style="a"] #cover .frame{ justify-content:flex-start; padding:0; }
  .book[data-style="a"] #cover .cover-top-row{
    background:var(--paper); justify-content:center; padding:2.4cqi 0; margin:0;
  }
  .book[data-style="a"] #cover .cover-top-row img{ height:5cqi; }
  .book[data-style="a"] #cover .cover-content{ padding:3cqi 7.4cqi 0; text-align:center; }
  .book[data-style="a"] #cover .cover-top{ display:block; }
  .book[data-style="a"] #cover .cover-eyebrow{
    background:var(--gold); color:#fff !important; display:inline-block;
    padding:.6cqi 2cqi; letter-spacing:.2em; font-size:calc(1.15cqi*var(--fs,1));
  }
  .book[data-style="a"] #cover .cover-title{ text-align:center; font-size:calc(8.2cqi*var(--fs,1)); margin-top:1.6cqi; }
  .book[data-style="a"] #cover .cover-year{
    text-align:center; font-style:normal; font-family:Arial,Helvetica,sans-serif;
    font-size:calc(1.1cqi*var(--fs,1)); letter-spacing:.32em; color:var(--ink-contrast) !important; margin-top:.7cqi;
  }
  .book[data-style="a"] #cover .cover-top::after{
    content:""; display:block; width:46%; height:1px; background:var(--line-on-ink); margin:2.1cqi auto 0;
  }
  .book[data-style="a"] #cover .cover-img{
    position:absolute; left:5%; width:90%; top:34%; height:54%;
    object-fit:cover; border-radius:2px;
  }
  .book[data-style="a"] #cover .scrim-t{ display:none; }
  .book[data-style="a"] #cover .scrim-b{
    top:34%; height:54%; left:5%; width:90%;
    background:linear-gradient(to top, rgba(10,10,8,.78) 0%, rgba(10,10,8,0) 32%);
  }
  .book[data-style="a"] #cover .cover-tagline{
    display:block; position:absolute; left:9%; bottom:9.5%; z-index:2; text-align:left;
    font-family:Arial,Helvetica,sans-serif; font-weight:700; font-size:calc(1.55cqi*var(--fs,1)); letter-spacing:.01em;
    color:#fff; line-height:1.4; max-width:42%;
  }
  .book[data-style="a"] #cover .cover-tagline::before{ content:""; display:block; width:2.4cqi; height:2px; background:var(--gold-bright); margin-bottom:.7cqi; }
  .book[data-style="a"] #cover .cover-bottom{ position:absolute; left:7.4cqi; right:7.4cqi; bottom:2.4cqi; text-align:center; }
  .book[data-style="a"] #cover .cover-bottom .body-copy{ display:none; }
  .book[data-style="a"] #cover .cover-hairline{ display:none; }
  .book[data-style="a"] #cover .cover-bottom > div:last-child{
    justify-content:center; gap:1.4cqi 2.2cqi; flex-wrap:wrap; font-size:calc(.95cqi*var(--fs,1)); letter-spacing:.06em;
    color:var(--ink-contrast) !important;
  }

  /* ---------- charte B : couverture recipe book — asymétrique, premium, motifs de points ---------- */
  .book[data-style="b"] #cover{ background:linear-gradient(160deg, #241c15 0%, #100c09 65%); }
  .book[data-style="b"] #cover .cover-img{
    top:auto; bottom:6%; height:48%; width:88%; left:6%;
    border-radius:3px; box-shadow:0 2cqi 5cqi rgba(0,0,0,.55);
  }
  .book[data-style="b"] #cover .scrim-t, .book[data-style="b"] #cover .scrim-b{ display:none; }
  .book[data-style="b"] #cover .frame{ justify-content:flex-start; }
  .book[data-style="b"] #cover .cover-top-row{ justify-content:flex-start; }
  .book[data-style="b"] #cover .cover-top-row span{ display:none; }
  .book[data-style="b"] #cover .cover-dots{
    display:block; position:absolute;
    background-image:radial-gradient(var(--ink-contrast) 1px, transparent 1.6px);
    background-size:2.1cqi 2.1cqi; opacity:.5;
  }
  .book[data-style="b"] #cover .cover-dots-top{ top:4.4cqi; right:7.4cqi; width:8.4cqi; height:4.2cqi; }
  .book[data-style="b"] #cover .cover-dots-bottom{ top:38%; right:7.4cqi; width:8.4cqi; height:8.4cqi; }
  .book[data-style="b"] #cover .cover-vertical{
    display:block; position:absolute; right:3.6cqi; top:14%; height:24%;
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:Arial,Helvetica,sans-serif; font-size:calc(1.05cqi*var(--fs,1)); letter-spacing:.3em;
    text-transform:uppercase; color:var(--ink-contrast);
  }
  .book[data-style="b"] #cover .cover-content{ flex:0 0 auto; padding-top:2.6cqi; }
  .book[data-style="b"] #cover .cover-top{
    max-width:58%;
  }
  .book[data-style="b"] #cover .cover-eyebrow{ display:none; }
  .book[data-style="b"] #cover .cover-title{ text-align:left; font-size:calc(5.2cqi*var(--fs,1)); line-height:1.05; }
  .book[data-style="b"] #cover h1.cover-title{ font-weight:800; }
  .book[data-style="b"] #cover .cover-title::first-line{ font-weight:300; }
  .book[data-style="b"] #cover .cover-year{
    display:block; width:7.4cqi; position:absolute; top:9.2cqi; right:7.4cqi; font-style:normal; border:1px solid var(--gold-bright);
    background:var(--ink); padding:.7cqi .5cqi; margin-top:0; text-align:center; font-size:calc(1.7cqi*var(--fs,1)); line-height:1.2; z-index:3;
  }
  .book[data-style="b"] #cover .cover-bottom{ margin-top:1.8cqi; max-width:56%; }
  .book[data-style="b"] #cover .cover-bottom .body-copy{
    text-transform:uppercase; font-size:calc(1.02cqi*var(--fs,1)); letter-spacing:.06em; font-weight:700; max-width:none;
  }
  .book[data-style="b"] #cover .cover-hairline{ display:none; }
  .book[data-style="b"] #cover .cover-contact-row{
    position:absolute; left:0; right:0; bottom:1.6cqi; justify-content:center !important;
  }
  .book[data-style="b"] #cover .cover-contact-row span:nth-child(1),
  .book[data-style="b"] #cover .cover-contact-row span:nth-child(2){ display:none; }
  .book[data-style="b"] #cover .cover-contact-row span:nth-child(3){ letter-spacing:.32em; font-size:calc(1cqi*var(--fs,1)); }

  /* ---------- charte C : couverture centrée, bloc compact façon carte de restaurant ---------- */
  .book[data-style="c"] #cover .cover-content{
    display:flex; flex-direction:column; justify-content:flex-end; flex:1;
    align-items:center; text-align:center; padding-bottom:2cqi;
  }
  .book[data-style="c"] #cover .cover-top,
  .book[data-style="c"] #cover .cover-bottom{ max-width:60cqi; }
  .book[data-style="c"] #cover .cover-title, .book[data-style="c"] #cover .cover-year{ text-align:center; }
  .book[data-style="c"] #cover .cover-bottom .body-copy{ text-align:center; max-width:52cqi; margin-left:auto; margin-right:auto; }
  .book[data-style="c"] #cover .cover-bottom > div:last-child{ justify-content:center; gap:2cqi; }

  /* ---------- charte D : magazine gourmand — bandeau de rubriques + photo en bas ---------- */
  .cover-teasers{ display:none; }
  .cover-tagline{ display:none; }
  .cover-vertical{ display:none; }
  .cover-dots{ display:none; }
  .book[data-style="d"] #cover .cover-teasers{
    display:flex; margin-top:1.8cqi; padding-top:1.6cqi; border-top:1px solid var(--line-on-ink);
  }
  .book[data-style="d"] #cover .cover-teasers > div{
    flex:1; padding:0 1.4cqi; border-left:1px solid var(--line-on-ink); text-align:center;
    font-family:Arial,Helvetica,sans-serif; color:var(--ink-contrast);
  }
  .book[data-style="d"] #cover .cover-teasers > div:first-child{ border-left:none; }
  .book[data-style="d"] #cover .cover-teasers b{
    display:block; font-weight:700; font-size:calc(1.15cqi*var(--fs,1)); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.5cqi;
  }
  .book[data-style="d"] #cover .cover-teasers span{ display:block; font-size:calc(1.05cqi*var(--fs,1)); color:var(--gold-bright); line-height:1.4; }
  .book[data-style="d"] #cover .cover-img{
    top:auto; bottom:0; height:38%; width:100%; left:0;
  }
  .book[data-style="d"] #cover .scrim-t{ display:none; }
  .book[data-style="d"] #cover .scrim-b{
    background:linear-gradient(to top, rgba(10,10,8,.8) 0%, rgba(10,10,8,0) 30%);
    top:auto; height:38%;
  }
  .book[data-style="d"] #cover .frame{ justify-content:flex-start; }
  .book[data-style="d"] #cover .cover-content{ flex:0 0 auto; height:44%; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:1.5cqi; }
  .book[data-style="d"] #cover .cover-eyebrow{ background:none !important; padding:0; color:var(--gold-bright) !important; }
  .book[data-style="d"] #cover .cover-title{ font-style:italic; font-weight:600; font-size:calc(7.4cqi*var(--fs,1)); }
  .book[data-style="d"] #cover .cover-bottom{
    display:grid; grid-template-columns:1fr 1fr; gap:2cqi; align-items:start; margin-top:1.4cqi;
  }
  .book[data-style="d"] #cover .cover-bottom .body-copy{ max-width:none; grid-column:1; }
  .book[data-style="d"] #cover .cover-hairline{ display:none; }
  .book[data-style="d"] #cover .cover-contact-row{
    grid-column:2; flex-direction:column; align-items:flex-end; gap:.6cqi; font-size:calc(1.1cqi*var(--fs,1));
  }
  .scrim-b{ position:absolute; inset:0; background:linear-gradient(to top, rgba(10,10,8,.92) 0%, rgba(10,10,8,.42) 42%, rgba(10,10,8,0) 68%); }
  .scrim-t{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,10,8,.72) 0%, rgba(10,10,8,0) 30%); }
</style>

<section class="sheet" aria-label="Lieux et jour J" id="organisation">
  <div class="running-header">
    <span>Catalogue 2027 · 2028</span>
  </div>
  <div class="frame" style="padding-top:7cqi; justify-content:flex-start;">
    <div class="section-head" style="margin-bottom:1.4cqi;">
      <p class="eyebrow">14 · Organisation</p>
      <h2 class="section-title">Préparer<br/><em>votre événement.</em></h2>
    </div>
    <p class="pr-intro"><b>Un bel événement se prépare des semaines à l’avance.</b> Ces étapes nous permettent de cuisiner, livrer et servir sereinement. Plus vous les anticipez, plus votre jour J sera fluide.</p>
    <div class="pr-grid">
      <div class="pr-card">
        <div class="pr-h"><i>1</i><h3>Votre lieu</h3></div>
        <ul class="dash compact">
          <li>Un accès pour véhicules professionnels</li>
          <li>Un espace de préparation ou un office</li>
          <li>Un point d’eau et une alimentation 220&nbsp;V</li>
          <li>Un emplacement pour l’étuve, si besoin</li>
        </ul>
        <p class="pr-why"><b>Pourquoi c’est important&nbsp;?</b> Nous cuisinons, dressons et servons sur place&nbsp;: sans ces équipements, le service ne peut pas se dérouler comme prévu. L’étuve, en particulier, maintient les plats à la bonne température jusqu’au service&nbsp;: c’est elle qui garantit des mets chauds et une qualité constante, même pour un grand nombre de convives. À vérifier 60 jours avant, avec le responsable du lieu. Si votre lieu conserve les déchets alimentaires, précisez-le&nbsp;: l’option (50&nbsp;€) est retirée du devis.</p>
      </div>
      <div class="pr-card">
        <div class="pr-h"><i>2</i><h3>Le déplacement</h3></div>
        <p class="body-copy">1,90&nbsp;€ par kilomètre parcouru, aller et retour comptés (ex.&nbsp;: lieu à 40&nbsp;km = 80&nbsp;km × 1,90&nbsp;€ = 152&nbsp;€), depuis Vert-Saint-Denis, péages et stationnement compris, sur une ligne distincte du devis. <b>Au-delà de 250&nbsp;km</b>, des frais de logement s’ajoutent, à définir avec la cheffe Huguette.</p>
        <p class="pr-why"><b>Pourquoi c’est important&nbsp;?</b> Le lieu détermine le trajet, le temps d’installation et l’équipe nécessaire. Donnez-nous l’adresse exacte dès la demande de devis.</p>
      </div>
    </div>
    <h3 class="list-head" style="margin-top:2.6cqi;">3 · Le calendrier, de la réservation au jour J</h3>
    <div class="pr-time">
      <div><b>J − 60</b><strong>Solde et caution</strong><span>Le nombre de convives est figé.</span><em>Nous commandons les produits et réservons l’équipe.</em></div>
      <div><b>J − 30</b><strong>Derniers ajouts</strong><span>Dernière confirmation des convives supplémentaires.</span><em>Base de nos quantités et de notre organisation.</em></div>
      <div><b>J − 14</b><strong>Menus, allergies, horaires</strong><span>Tout est confirmé par écrit.</span><em>Les allergies protègent vos invités&nbsp;: signalez-les sans attendre.</em></div>
      <div><b>Jour J</b><strong>Complément éventuel</strong><span>Si les convives sont plus nombreux.</span><em>Nous ajustons le service en direct.</em></div>
    </div>
    <p class="note" style="margin-top:.8cqi;">À partir de J − 60, le nombre de convives ne peut plus être revu à la baisse, uniquement à la hausse. Allergies et régimes sont pris en compte dans la mesure du possible, sans garantie d’absence totale d’allergènes. Au-delà de 30&nbsp;minutes de dépassement, 80&nbsp;€ par heure entamée et par serveur.</p>
    <div class="pr-grid" style="margin-top:2.2cqi;">
      <div class="pr-card">
        <div class="pr-h"><i>4</i><h3>Le déroulé du jour J</h3></div>
        <ol class="og-time">
          <li><b>Arrivée</b><span>Accueil des invités, vin d’honneur</span></li>
          <li><b>Repas</b><span>Buffet, plateau ou service à l’assiette</span></li>
          <li><b>Soirée</b><span>Pièce montée, animations, discours, bal</span></li>
        </ol>
        <p class="pr-why"><b>Pourquoi c’est important&nbsp;?</b> Un programme précis permet à la cuisine et au service de se caler sur votre rythme. À nous transmettre 4 à 6 semaines avant, horaires confirmés 14 jours avant.</p>
      </div>
      <div class="pr-card gold">
        <div class="pr-h"><i>+</i><h3>La dégustation · 70&nbsp;€ par personne</h3></div>
        <p class="body-copy">Le meilleur moyen de choisir en confiance. Facultative mais recommandée, non déductible du devis. Sur réservation, en session partagée de 2 à 10&nbsp;personnes (1&nbsp;h à 1&nbsp;h&nbsp;30), au restaurant <b>Chez Lina</b> à Brunoy, entre 15&nbsp;h et 18&nbsp;h ou après 21&nbsp;h. Annulation 48&nbsp;h avant.</p>
        <p class="pr-why">Au menu&nbsp;: apéritif de la cheffe (5 pièces) puis repas de votre choix, service au buffet ou au plateau (2&nbsp;viandes, 2&nbsp;poissons, 1&nbsp;légume, 3&nbsp;accompagnements) ou à l’assiette (2&nbsp;entrées, 1&nbsp;viande, 1&nbsp;poisson, 1&nbsp;dessert).</p>
      </div>
    </div>
  </div>

        <li><b>Claims:</b> in writing, within two working days after the service.</li>
      </ul>

<section class="sheet" aria-label="Lieux et jour J" id="organisation">
  <div class="running-header">
    <span>Catalogue 2027 · 2028</span>
  </div>
  <div class="frame" style="padding-top:7cqi; justify-content:flex-start;">
    <div class="section-head" style="margin-bottom:1.4cqi;">
      <p class="eyebrow">14 · Organization</p>
      <h2 class="section-title">Prepare<br/><em>your event.</em></h2>
    </div>
    <p class="pr-intro"><b>A beautiful event is prepared weeks in advance.</b> These steps let us cook, deliver and serve with peace of mind. The earlier you plan them, the smoother your big day will be.</p>
    <div class="pr-grid">
      <div class="pr-card">
        <div class="pr-h"><i>1</i><h3>Your venue</h3></div>
        <ul class="dash compact">
          <li>Access for professional vehicles</li>
          <li>A preparation area or pantry</li>
          <li>A water point and a 220 V power supply</li>
          <li>A spot for the warming cabinet, if needed</li>
        </ul>
        <p class="pr-why"><b>Why is it important?</b> We cook, plate and serve on site: without this equipment, the service cannot run as planned. The warming cabinet in particular keeps dishes at the right temperature until service: it is what guarantees hot food and consistent quality, even for a large number of guests. Check 60 days before, with the venue manager. If your venue keeps the food waste, let us know: the option (€50) is removed from the quote.</p>
      </div>
      <div class="pr-card">
        <div class="pr-h"><i>2</i><h3>Travel</h3></div>
        <p class="body-copy">€1.90 per kilometre driven, outward and return journeys counted (e.g. venue 40 km away = 80 km × €1.90 = €152), from Vert-Saint-Denis, tolls and parking included, on a separate line of the quote. <b>Beyond 250 km</b>, accommodation costs are added, to be agreed with chef Huguette.</p>
        <p class="pr-why"><b>Why is it important?</b> The venue determines the journey, the set-up time and the team needed. Give us the exact address as soon as you request your quote.</p>
      </div>
    </div>
    <h3 class="list-head" style="margin-top:2.6cqi;">3 · The calendar, from booking to the big day</h3>
    <div class="pr-time">
      <div><b>D − 60</b><strong>Balance and security deposit</strong><span>The guest count is frozen.</span><em>We order the produce and book the team.</em></div>
      <div><b>D − 30</b><strong>Late additions</strong><span>Last confirmation of additional guests.</span><em>The basis of our quantities and organization.</em></div>
      <div><b>D − 14</b><strong>Menus, allergies, times</strong><span>Everything is confirmed in writing.</span><em>Allergy information protects your guests: report it without delay.</em></div>
      <div><b>Event day</b><strong>Possible extra</strong><span>If there are more guests.</span><em>We adjust the service live.</em></div>
    </div>
    <p class="note" style="margin-top:.8cqi;">From D − 60, the guest count can no longer be reduced, only increased. Allergies and diets are taken into account as far as possible, without guarantee of a total absence of allergens. Beyond 30 minutes of overtime, €80 per hour started and per server.</p>
    <div class="pr-grid" style="margin-top:2.2cqi;">
      <div class="pr-card">
        <div class="pr-h"><i>4</i><h3>The big day schedule</h3></div>
        <ol class="og-time">
          <li><b>Arrival</b><span>Welcoming guests, canapé reception</span></li>
          <li><b>Meal</b><span>Buffet, platter or plated service</span></li>
          <li><b>Evening</b><span>Wedding cake, entertainment, speeches, dance</span></li>
        </ol>
        <p class="pr-why"><b>Why is it important?</b> A precise program lets the kitchen and service follow your rhythm. Send it to us 4 to 6 weeks before; times are confirmed 14 days before.</p>
      </div>
      <div class="pr-card gold">
        <div class="pr-h"><i>+</i><h3>The tasting · €70 per person</h3></div>
        <p class="body-copy">The best way to choose with confidence. Optional but recommended, not deductible from the quote. By reservation, in a shared session of 2 to 10 people (1 h to 1 h 30), at the restaurant <b>Chez Lina</b> in Brunoy, between 3 pm and 6 pm or after 9 pm. Cancellation 48 h before.</p>
        <p class="pr-why">Menu: chef’s appetizer (5 pieces) then a meal of your choice, buffet or platter service (2 meats, 2 fish, 1 vegetable, 3 sides) or plated (2 starters, 1 meat, 1 fish, 1 dessert).</p>
      </div>
    </div>

    <div class="cl2-story">
      <img src="images/chezlina/mama-lina.png" alt="Mama Lina"/>
      <div><p>Mama Lina was born in Congo. She passed on to her four daughters what mattered most to her: attention to others, care given to every dish, and the idea that a table always brings together more than a meal.</p>
      <p>Today, chef Huguette and her sisters keep this legacy alive in Brunoy, with <b>Chez Lina</b>: a Franco-African fusion restaurant, opened in tribute to their mother.</p></div>
    </div>
    <p class="cl2-quote">“Her name became our restaurant’s name. Her way of bringing people together became our way of hosting.”</p>
    <div class="cl2-roots">
      <div><i>The earth</i><span>Cassava, plantain and spices recall the family’s roots.</span></div>
      <div><i>The fire</i><span>The embers give the dishes their slow cooking and their character.</span></div>
      <div><i>The table</i><span>The meal brings generations together and lets memories flow.</span></div>

  /* ---------- charte D : éditorial contemporain — vert profond, blanc chaud, filets fins, serif moderne ---------- */
  .book[data-style="d"]{
    --fs:1.12;
    --heading-font:"Instrument Serif","Cormorant Garamond",Georgia,serif;
    --ink:#0f2a22; --paper:#fbfaf7; --cream:#f3f0e9;

  .tf-duo.tf-4 span{ display:block; font-size:calc(1.15cqi*var(--fs,1)); }
  #chezlina .cl2-cards{ grid-template-columns:1fr; }
  .op-photo{ grid-column:1 / span 2; display:block; width:100%; height:9cqi; object-fit:cover; object-position:50% 50%; margin-top:1.4cqi; }
  @media screen and (max-width:1100px){ .op-photo{ height:26cqi; } }

    .sheet .cn-rate{ gap:2cqi !important; } .sheet .sm{ width:5.8cqi; height:5.8cqi; } .sheet .cn-rate i{ width:4.6cqi !important; height:4.6cqi !important; }
    .sheet .cn-intro{ grid-template-columns:1fr; gap:2cqi; }
    .sheet .cn-lines{ grid-template-columns:1fr; }
    /* portrait de la cheffe */
    #portrait .pt-hero{ position:relative !important; left:auto; right:auto; top:auto; height:118cqi !important; flex:none; }
    #portrait .pt-body{ position:relative !important; left:auto !important; right:auto !important; top:auto !important; bottom:auto !important; margin:-20cqi 5cqi 0; }

<script>
  (function(){
    var stage=document.getElementById('stage');
    var style='c', lang='fr';
    var L={fr:{style:'Charte',lang:'Langue',sa:'Choisir une charte graphique',la:'Choisir la langue'},en:{style:'Style',lang:'Language',sa:'Choose a design style',la:'Choose language'}};
    function paint(){
      var bk=document.getElementById('cdo-book'); if(bk) bk.setAttribute('data-style',style);
      document.querySelectorAll('.style-switcher button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.pick===style?'true':'false'); });
    }
    function render(l){
      lang=l; stage.innerHTML='';
      stage.appendChild(document.getElementById('tpl-'+l).content.cloneNode(true));
      document.documentElement.lang=l;
      document.getElementById('style-label').textContent=L[l].style; document.getElementById('lang-label').textContent=L[l].lang;
      document.querySelector('.style-switcher').setAttribute('aria-label',L[l].sa); document.querySelector('.lang-switcher').setAttribute('aria-label',L[l].la);
      document.querySelectorAll('.lang-switcher button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===l?'true':'false'); });
      document.title = l==='en' ? 'Cuillère d’Or Catalogue 2027-2028' : 'Catalogue Cuillère d\u2019Or 2027-2028';
      paint();
      try{ localStorage.setItem('cdo-catalogue-lang',l);}catch(e){}
    }
    document.querySelectorAll('.style-switcher button').forEach(function(b){ b.addEventListener('click',function(){ style=b.dataset.pick; paint(); try{localStorage.setItem('cdo-catalogue-style',style);}catch(e){} }); });
    document.querySelectorAll('.lang-switcher button').forEach(function(b){ b.addEventListener('click',function(){ var y=window.scrollY; render(b.dataset.lang); window.scrollTo(0,y); }); });
    var sv=null, sl=null; try{ sv=localStorage.getItem('cdo-catalogue-style'); sl=localStorage.getItem('cdo-catalogue-lang'); }catch(e){}
    if(sv==='a'||sv==='b'||sv==='c'||sv==='d') style=sv;
    render(sl==='en'?'en':'fr');
  })();
</script>
